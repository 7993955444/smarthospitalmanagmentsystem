{% extends 'navigation_bar.html' %}

{% block body %}

<div class="container mt-5">

    <h2 class="text-center">Add Doctor</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label>Name</label>
            {{ form.name }}
        </div>

        <div class="mb-3">
            <label>Mobile</label>
            {{ form.mobile }}
        </div>

        <div class="mb-3">
            <label>Speciality</label>
            {{ form.speciality }}
        </div>

        <div class="mb-3">
            <label>Age</label>
            {{ form.age }}
        </div>

        <div class="mb-3">
            <label>Gender</label>
            {{ form.gender }}
        </div>

        <button type="submit" class="btn btn-primary">
            Save Doctor
        </button>

    </form>

</div>

{% endblock %}
